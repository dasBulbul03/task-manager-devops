# ========================================
# CI/CD Pipeline for Task Manager (AWS ECR + EC2)
# ========================================

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deployments on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  APP_NAME: task-manager
  CONTAINER_NAME: task-app
  EC2_SSH_USER: ec2-user
  EC2_TAG_NAME: taskmanager-ec2

jobs:
  # ========================================
  # Build and Test
  # ========================================
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Build with Maven
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # Run tests
      - name: Run tests
        run: mvn -B test

  # ========================================
  # Build and Push Docker Image to ECR
  # ========================================
  docker:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image (immutable SHA + latest)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Deploy to EC2
  # ========================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials (to resolve the live EC2 public address)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve the CURRENT EC2 public IP (the Terraform-managed Elastic IP)
      - name: Get EC2 public IP
        id: get-ip
        run: |
          IP=$(aws ec2 describe-instances \
            --region "${{ env.AWS_REGION }}" \
            --filters "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[0].PublicIpAddress' \
            --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::error::Could not determine running EC2 public IP"
            exit 1
          fi
          echo "Resolved EC2 IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # Add SSH key
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -lf ~/.ssh/id_rsa

      # Update known hosts
      - name: Update known hosts
        run: |
          ssh-keyscan -H ${{ steps.get-ip.outputs.ip }} >> ~/.ssh/known_hosts

      # Deploy to EC2 (EC2 authenticates to ECR via its IAM instance profile)
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            ${{ env.EC2_SSH_USER }}@${{ steps.get-ip.outputs.ip }} << 'EOF'
            set -e
            REGISTRY=${{ needs.docker.outputs.registry }}

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker pull "$REGISTRY/${{ env.APP_NAME }}:latest"

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              "$REGISTRY/${{ env.APP_NAME }}:latest"

            docker ps
          EOF

      # Verify deployment
      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ steps.get-ip.outputs.ip }}:8080/actuator/health"; then
              echo "Deployment successful!"
              exit 0
            fi
            echo "Not ready yet (${i}0s)..."
            sleep 10
          done
          echo "Health check failed"
          exit 1