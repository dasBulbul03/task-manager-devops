# ========================================
# CI/CD Pipeline for Task Manager
# ========================================

name: Production Delivery Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

# Environment variables
env:
  AWS_REGION: ap-south-1
  APP_NAME: task-manager
  CONTAINER_NAME: task-app
  EC2_SSH_USER: ec2-user

jobs:
  # ========================================
  # Build and Test
  # ========================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      # Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      # Run tests
      - name: Run tests
        run: mvn test

  # ========================================
  # Build and Push Docker Image
  # ========================================
  docker:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Deploy to EC2
  # ========================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Add SSH key
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -lf ~/.ssh/id_rsa
      
      # Wait for EC2 to be ready
      - name: Wait for EC2
        run: |
          echo "Waiting for EC2 to be ready..."
          sleep 30
      
      # SSH and deploy
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no ${{ env.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            REGISTRY=${{ needs.docker.outputs.registry }}

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker pull "$REGISTRY/${{ env.APP_NAME }}:latest"

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL=${{ secrets.DB_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              "$REGISTRY/${{ env.APP_NAME }}:latest"

            docker ps
          EOF
      
      # Verify deployment
      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 15
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health || exit 1
          echo "Deployment successful!"